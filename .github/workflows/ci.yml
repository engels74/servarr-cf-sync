name: ci
on:
  pull_request:
  push:
    branches: [main, feat/standardize-ci-renovate]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: engels74/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
  python:
    needs: guard
    uses: engels74/automation/.github/workflows/python.yml@v1.0.0
    with:
      version: '3.14'
      command: bash .github/scripts/check.sh
  required:
    name: ci / required
    if: always()
    needs: [guard, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: engels74/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
      - uses: engels74/automation/actions/gate@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard python
